name: Versioned research Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore version-local large research artifacts
        run: python scripts/restore_large_files.py
      - name: Install publication build dependency
        run: python -m pip install plotly==7.1.0
      - name: Build static publication
        run: python scripts/build_pages.py
      - name: Verify local links, archives, hashes and Pages size
        run: python scripts/verify_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Publish verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
